global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "spring_micrometer"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: "ToDo"

  - job_name: "mongodb"
    static_configs:
      - targets: ['mongodb-exporter:9216']
        labels:
          database: "mongodb"


