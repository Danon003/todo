databaseChangeLog:
  - changeSet:
      id: 9
      author: your_name
      changes:
        - createTable:
            tableName: user_groups
            remarks: "Связь пользователей с группами (many-to-many)"
            columns:
              - column:
                  name: user_id
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "ID пользователя"
              - column:
                  name: group_id
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "ID группы"
              - column:
                  name: created_at
                  type: TIMESTAMP
                  remarks: "Дата добавления в группу"
        - addPrimaryKey:
            tableName: user_groups
            constraintName: pk_user_groups
            columnNames: user_id, group_id
        - addForeignKeyConstraint:
            baseTableName: user_groups
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_groups_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: user_groups
            baseColumnNames: group_id
            referencedTableName: groups
            referencedColumnNames: id
            constraintName: fk_user_groups_group
            onDelete: CASCADE