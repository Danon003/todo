databaseChangeLog:
  - changeSet:
      id: 10
      author: your_name
      changes:
        - createTable:
            tableName: video_meetings
            remarks: "Таблица видеовстреч"
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: "Уникальный идентификатор встречи"
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                  remarks: "Название встречи"
              - column:
                  name: description
                  type: TEXT
                  remarks: "Описание встречи"
              - column:
                  name: meeting_url
                  type: TEXT
                  remarks: "URL для подключения"
              - column:
                  name: meeting_id
                  type: VARCHAR(255)
                  remarks: "ID встречи в сервисе"
              - column:
                  name: start_time
                  type: TIMESTAMP
                  remarks: "Время начала"
              - column:
                  name: end_time
                  type: TIMESTAMP
                  remarks: "Время окончания"
              - column:
                  name: created_by
                  type: INT
                  remarks: "ID создателя встречи"
              - column:
                  name: group_id
                  type: INT
                  remarks: "ID группы"
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValue: true
                  remarks: "Активна ли встреча"
              - column:
                  name: created_at
                  type: TIMESTAMP
                  remarks: "Дата создания"
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  remarks: "Дата обновления"
              - column:
                  name: reminder_sent
                  type: BOOLEAN
                  defaultValue: false
                  remarks: "Отправлено ли напоминание"
        - addForeignKeyConstraint:
            baseTableName: video_meetings
            baseColumnNames: created_by
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_video_meetings_creator
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: video_meetings
            baseColumnNames: group_id
            referencedTableName: groups
            referencedColumnNames: id
            constraintName: fk_video_meetings_group
            onDelete: SET NULL