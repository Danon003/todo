databaseChangeLog:
  - changeSet:
      id: 11
      author: your_name
      changes:
        - createTable:
            tableName: role_audit_log
            remarks: "Таблица аудита изменения ролей пользователей"
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: "Уникальный идентификатор записи аудита"
              - column:
                  name: user_id
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "ID пользователя"
              - column:
                  name: old_role
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                  remarks: "Старая роль"
              - column:
                  name: new_role
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                  remarks: "Новая роль"
              - column:
                  name: changed_at
                  type: TIMESTAMP
                  remarks: "Время изменения"
        - addForeignKeyConstraint:
            baseTableName: role_audit_log
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_role_audit_user
            onDelete: CASCADE