databaseChangeLog:
  - changeSet:
      id: 7
      author: your_name
      changes:
        - createTable:
            tableName: task_assignments
            remarks: "Таблица назначений задач пользователям"
            columns:
              - column:
                  name: task_id
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "ID задачи"
              - column:
                  name: user_id
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "ID пользователя"
              - column:
                  name: assigned_by
                  type: INT
                  remarks: "ID пользователя, назначившего задачу"
              - column:
                  name: assigned_at
                  type: TIMESTAMP
                  remarks: "Дата назначения"
              - column:
                  name: status
                  type: VARCHAR(15)
                  defaultValue: "NOT_STARTED"
                  constraints:
                    nullable: false
                  remarks: "Статус выполнения: NOT_STARTED, IN_PROGRESS, COMPLETED, OVERDUE"
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  remarks: "Дата последнего обновления"
              - column:
                  name: solution_file_name
                  type: VARCHAR(255)
                  remarks: "Имя файла решения"
              - column:
                  name: solution_file_path
                  type: VARCHAR(500)
                  remarks: "Путь к файлу решения"
              - column:
                  name: solution_file_size
                  type: BIGINT
                  remarks: "Размер файла решения"
              - column:
                  name: solution_uploaded_at
                  type: TIMESTAMP
                  remarks: "Дата загрузки решения"
              - column:
                  name: grade
                  type: INT
                  remarks: "Оценка за задание"
              - column:
                  name: teacher_comment
                  type: TEXT
                  remarks: "Комментарий преподавателя"
        - addPrimaryKey:
            tableName: task_assignments
            constraintName: pk_task_assignments
            columnNames: task_id, user_id
        - addForeignKeyConstraint:
            baseTableName: task_assignments
            baseColumnNames: task_id
            referencedTableName: tasks
            referencedColumnNames: id
            constraintName: fk_task_assignments_task
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: task_assignments
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_task_assignments_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: task_assignments
            baseColumnNames: assigned_by
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_task_assignments_assigned_by
            onDelete: SET NULL
        - sql:
            comment: "Добавляем constraint для проверки status"
            sql: |
              ALTER TABLE task_assignments ADD CONSTRAINT valid_status 
              CHECK (status IN ('NOT_STARTED', 'IN_PROGRESS', 'COMPLETED', 'OVERDUE'));