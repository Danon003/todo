databaseChangeLog:
  - changeSet:
      id: 2
      author: your_name
      changes:
        - createTable:
            tableName: groups
            remarks: "Таблица учебных групп"
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: "Уникальный идентификатор группы"
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                  remarks: "Название группы"
              - column:
                  name: description
                  type: VARCHAR(255)
                  remarks: "Описание группы"
              - column:
                  name: created_at
                  type: TIMESTAMP
                  remarks: "Дата создания группы"
              - column:
                  name: teacher_id
                  type: INT
                  remarks: "ID преподавателя группы"
        - addForeignKeyConstraint:
            baseTableName: groups
            baseColumnNames: teacher_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_groups_teacher
            onDelete: SET NULL
            onUpdate: RESTRICT