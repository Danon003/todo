databaseChangeLog:
  - changeSet:
      id: 12
      author: your_name
      changes:
        # Индексы для scheduled_notifications
        - createIndex:
            indexName: idx_scheduled_notifications_status_scheduled
            tableName: scheduled_notifications
            columns:
              - column: { name: status }
              - column: { name: scheduled_time }
        - createIndex:
            indexName: idx_scheduled_notifications_task_user
            tableName: scheduled_notifications
            columns:
              - column: { name: task_id }
              - column: { name: user_id }
        - createIndex:
            indexName: idx_scheduled_notifications_user
            tableName: scheduled_notifications
            columns:
              - column: { name: user_id }
        - createIndex:
            indexName: idx_scheduled_notifications_scheduled_time
            tableName: scheduled_notifications
            columns:
              - column: { name: scheduled_time }

        # Индекс для tasks
        - createIndex:
            indexName: idx_tasks_deadline
            tableName: tasks
            columns:
              - column: { name: deadline }

        # Индекс для user_groups
        - createIndex:
            indexName: idx_user_groups
            tableName: user_groups
            columns:
              - column: { name: user_id }
              - column: { name: group_id }

        # Индексы для video_meetings
        - createIndex:
            indexName: idx_video_meetings_created_by
            tableName: video_meetings
            columns:
              - column: { name: created_by }
        - createIndex:
            indexName: idx_video_meetings_group_id
            tableName: video_meetings
            columns:
              - column: { name: group_id }
        - createIndex:
            indexName: idx_video_meetings_is_active
            tableName: video_meetings
            columns:
              - column: { name: is_active }
        - createIndex:
            indexName: idx_video_meetings_start_time
            tableName: video_meetings
            columns:
              - column: { name: start_time }