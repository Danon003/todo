databaseChangeLog:
  - changeSet:
      id: "v1.0.0_create_role_audit_log_table-01"
      author: danon
      comment: "Create role_audit_log table"
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: "task_tracker"
                tableName: "role_audit_log"
      changes:
        - createTable:
            schemaName: "task_tracker"
            tableName: "role_audit_log"
            remarks: "Таблица аудита изменения ролей пользователей"
            columns:
              - column:
                  name: "id"
                  type: "BIGINT"
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: "Уникальный идентификатор записи аудита"
              - column:
                  name: "user_id"
                  type: "BIGINT"
                  constraints:
                    nullable: false
                  remarks: "ID пользователя"
              - column:
                  name: "old_role"
                  type: "VARCHAR(255)"
                  constraints:
                    nullable: false
                  remarks: "Старая роль"
              - column:
                  name: "new_role"
                  type: "VARCHAR(255)"
                  constraints:
                    nullable: false
                  remarks: "Новая роль"
              - column:
                  name: "changed_at"
                  type: "TIMESTAMP"
                  remarks: "Время изменения"
        - addForeignKeyConstraint:
            baseTableName: "role_audit_log"
            baseColumnNames: "user_id"
            referencedTableSchemaName: "task_tracker"
            referencedTableName: "users"
            referencedColumnNames: "id"
            constraintName: "fk_role_audit_user"
            onDelete: "CASCADE"
      rollback:
        - dropTable:
            schemaName: "task_tracker"
            tableName: "role_audit_log"