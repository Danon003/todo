databaseChangeLog:
  - changeSet:
      id: "v1.0.0_create_user_groups_table-01"
      author: danon
      comment: "Create user_groups junction table"
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: "task_tracker"
                tableName: "user_groups"
      changes:
        - createTable:
            schemaName: "task_tracker"
            tableName: "user_groups"
            remarks: "Связь пользователей с группами (many-to-many)"
            columns:
              - column:
                  name: "user_id"
                  type: "BIGINT"
                  constraints:
                    nullable: false
                  remarks: "ID пользователя"
              - column:
                  name: "group_id"
                  type: "BIGINT"
                  constraints:
                    nullable: false
                  remarks: "ID группы"
              - column:
                  name: "created_at"
                  type: "TIMESTAMP"
                  remarks: "Дата добавления в группу"
        - addPrimaryKey:
            tableName: "user_groups"
            constraintName: "pk_user_groups"
            columnNames: "user_id, group_id"
        - addForeignKeyConstraint:
            baseTableName: "user_groups"
            baseColumnNames: "user_id"
            referencedTableSchemaName: "task_tracker"
            referencedTableName: "users"
            referencedColumnNames: "id"
            constraintName: "fk_user_groups_user"
            onDelete: "CASCADE"
        - addForeignKeyConstraint:
            baseTableName: "user_groups"
            baseColumnNames: "group_id"
            referencedTableSchemaName: "task_tracker"
            referencedTableName: "groups"
            referencedColumnNames: "id"
            constraintName: "fk_user_groups_group"
            onDelete: "CASCADE"
      rollback:
        - dropTable:
            schemaName: "task_tracker"
            tableName: "user_groups"

  - changeSet:
      id: "v1.0.0_create_user_groups_table-02"
      author: danon
      comment: "Create composite index on user_groups"
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            schemaName: "task_tracker"
            tableName: "user_groups"
      changes:
        - createIndex:
            indexName: "idx_user_groups"
            tableName: "user_groups"
            schemaName: "task_tracker"
            columns:
              - column: { name: "user_id" }
              - column: { name: "group_id" }
      rollback:
        - dropIndex:
            indexName: "idx_user_groups"
            tableName: "user_groups"
            schemaName: "task_tracker"