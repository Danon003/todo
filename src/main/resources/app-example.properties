spring.application.name=ToDo

# PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/your_db
spring.datasource.username=your_username
spring.datasource.password=your_password

# Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# JWT
jwt_secret=your_jwt_secret_key

# Kafka
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.properties.spring.json.add.type.headers=false

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MinIO / S3
spring.cloud.aws.s3.endpoint=http://localhost:9000
spring.cloud.aws.s3.region=us-east-1
spring.cloud.aws.s3.path-style-access=true
spring.cloud.aws.credentials.access-key=your_minio_access_key
spring.cloud.aws.credentials.secret-key=your_minio_secret_key
spring.cloud.aws.stack.auto=false
app.storage.bucket-name=your_bucket_name

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/your_db
spring.data.mongodb.auto-index-creation=true

# Email (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Password reset
app.password-reset.token-expiration-minutes=30

# Async task pool
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# Video meetings cleanup
video.meetings.cleanup-after-days=4

# Actuator + Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.percentiles-histogram.jvm.gc.pause=true
management.metrics.enable.redis=true
management.metrics.enable.mongodb=true
management.metrics.enable.kafka=true
management.metrics.enable.jvm=true
management.metrics.enable.logback=true
management.metrics.enable.hikaricp=true
management.metrics.enable.http=true
management.metrics.enable.system=true
management.server.port=8080

# Metrics tags
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.instance=${HOSTNAME:localhost}
management.metrics.tags.environment=local